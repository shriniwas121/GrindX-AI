trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self

- task: Docker@2
  displayName: 'Build GrindX backend image'
  inputs:
    command: 'build'
    repository: 'grindx-backend'
    Dockerfile: '$(Build.SourcesDirectory)/backend/Dockerfile'
    buildContext: '$(Build.SourcesDirectory)/backend'
    tags: |
      $(Build.BuildId)

- script: |
    docker image inspect grindx-backend:$(Build.BuildId)
  displayName: 'Verify Docker image'